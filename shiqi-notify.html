var big=document.getElementById("big");
var statusEl=document.getElementById("status");
var logEl=document.getElementById("log");
var audio=new Audio(BEEP);
var last=Math.floor(new Date().getTime()/1000);
var running=false;
var seen={};
function notify(msg){
  big.className="on";
  big.innerHTML=msg;
  statusEl.innerHTML="有新消息 "+new Date().toLocaleTimeString();
  try{audio.currentTime=0;audio.play();}catch(e){}
  setTimeout(function(){try{audio.currentTime=0;audio.play();}catch(e){}},450);
  try{if(navigator.vibrate)navigator.vibrate([300,150,300]);}catch(e){}
}
function poll(){
  if(!running)return;
  var x=new XMLHttpRequest();
  x.open("GET","https://ntfy.sh/"+TOPIC+"/json?poll=1&since="+last,true);
  x.timeout=8000;
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status===200){
      statusEl.innerHTML="已连接 · "+new Date().toLocaleTimeString();
      var lines=x.responseText.split("\n");
      for(var i=0;i<lines.length;i++){
        if(!lines[i])continue;
        try{
          var o=JSON.parse(lines[i]);
          if(o.event==="message"&&o.message&&!seen[o.id]){
            seen[o.id]=1;
            if(o.time&&o.time>last)last=o.time;
            notify(o.message);
          }
        }catch(e){}
      }
    }else{
      statusEl.innerHTML="连不上 "+x.status+" · 重试中";
    }
    setTimeout(poll,2000);
  };
  x.ontimeout=function(){statusEl.innerHTML="超时 · 重试中";setTimeout(poll,2000);};
  try{x.send();}catch(e){setTimeout(poll,3000);}
}
document.getElementById("go").onclick=function(){
  running=true;
  this.style.background="#1a7f37";
  this.innerHTML="运行中";
  big.innerHTML="等着";
  try{audio.play();}catch(e){}
  poll();
};
</script>
